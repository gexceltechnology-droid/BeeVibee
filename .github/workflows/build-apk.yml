name: Build Bee Vibe Admin APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle Build Tools
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Configure Android SDK Location
      run: |
        echo "sdk.dir=$ANDROID_HOME" > android-admin-app/local.properties

    - name: Build Debug APK
      run: |
        cd android-admin-app
        gradle assembleDebug --no-daemon

    - name: Upload Admin APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BeeVibeAdmin-APK
        path: android-admin-app/app/build/outputs/apk/debug/app-debug.apk
